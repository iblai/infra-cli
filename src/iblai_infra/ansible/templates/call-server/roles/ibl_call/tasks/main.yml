---
# ibl_call role — configure and launch the LiveKit call stack.
#
# Prerequisites (handled by earlier roles):
#   - docker, awscli, python, ibl_cli_ops
#   - /ibl exists and is owned by the ansible user
#
# Inputs (set in extra-vars):
#   - base_domain       — PARENT domain (e.g. "stg1.iblai.org"). `ibl call` auto-
#                         prepends "call." when generating the LiveKit WS URL, so
#                         passing "call.stg1.iblai.org" yields wss://call.call.stg1…
#                         Always pass the parent; let the CLI add the prefix.
#   - aws_*             — ECR auth for image pulls
#   - git_access_token  — unused here but accepted for parity

# ---------------------------------------------------------------------------
# IBL_ROOT is required by every `ibl` sub-command on the call server. The
# single-server stg AMIs have it baked into the login environment; a fresh
# call-server bootstrap does not. Set it for ALL shell tasks in this role
# (via each task's environment block), and persist to ~/.bashrc so operator-
# driven interventions via SSH pick it up automatically.
# ---------------------------------------------------------------------------

- name: Persist IBL_ROOT export in ~/.bashrc
  become: false
  lineinfile:
    path: "{{ bashrc_path | default('/home/' ~ ansible_user ~ '/.bashrc') }}"
    line: "export IBL_ROOT={{ ibl_root }}/"
    regexp: '^export IBL_ROOT='
    state: present
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# NODE_ID is required in the process env by `ibl render` (6.x config system).
# regexp so a re-run with a different node_id overwrites instead of appending.
- name: Persist NODE_ID export in ~/.bashrc
  become: false
  lineinfile:
    path: "{{ bashrc_path | default('/home/' ~ ansible_user ~ '/.bashrc') }}"
    line: "export NODE_ID={{ node_id }}"
    regexp: '^export NODE_ID='
    state: present
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Configure base domain in ibl config
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config set BASE_DOMAIN='{{ base_domain }}'
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# The 5.x `call-only` environment preset is gone; a bare `ibl init`
# (done in the ibl_cli_ops role) starts with every service off, and the
# call server enables exactly the one it runs. Ordering matters: the
# LiveKit API key/secret are generator-backed secrets gated on
# RUN_LIVEKIT, so the toggle must be on before `ibl secrets generate`
# fills them, and the render that writes the call templates comes last.
- name: Enable LiveKit service
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl services enable IBL_CALL.RUN_LIVEKIT
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Generate secrets and render call templates
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets generate
    ibl render
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Ensure ibl_local_default docker network exists
  become: false
  shell: |
    docker network inspect ibl_local_default >/dev/null 2>&1 || \
      docker network create ibl_local_default
  args:
    executable: /bin/bash
  changed_when: false

- name: Login to ECR
  become: false
  shell: |
    aws ecr get-login-password --region {{ aws_default_region }} | \
      docker login --username AWS --password-stdin \
      765174860755.dkr.ecr.{{ aws_default_region }}.amazonaws.com
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_default_region }}"
  no_log: true

- name: Launch the call stack (ibl call up)
  become: false
  # `ibl call start` (iblai-cli-ops ≤ 5.8.1) passes `--remove-orphans` to a
  # `docker compose` subcommand that Docker Compose v5 (bundled with Docker
  # 29+) rejects with "unknown flag: --remove-orphans". `ibl call up` takes
  # a simpler path and works on both Compose v2 and v5 stacks. `-d` because
  # without it `ibl call up` runs `docker compose up` attached and never returns.
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl call up -d
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: call_start_result
  changed_when: true

- name: Wait for LiveKit API (:7880) to accept connections
  become: false
  # 300s accommodates a cold-boot ECR pull of the livekit image + startup
  # (transcoding containers are slower than the API itself).
  wait_for:
    host: 127.0.0.1
    port: 7880
    timeout: 300
    state: started

- name: Capture call secrets (ibl call show-call-secrets)
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl call show-call-secrets
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: call_secrets_result
  changed_when: false
  # Secrets printed to the operator terminal via the `debug` task below,
  # never echoed to ansible's default logging.
  no_log: true

- name: Fail if `ibl call show-call-secrets` produced no output
  # Don't silently paint an empty "secrets" banner — surface the failure so the
  # operator knows to ssh in and run the command themselves. `no_log` stays
  # true because stderr might contain partial secret material on some failure
  # modes.
  fail:
    msg: |
      `ibl call show-call-secrets` returned no output.
      SSH in and run it manually:
        ssh ubuntu@<host>
        pyenv activate {{ venv_name }} && ibl call show-call-secrets
  when: call_secrets_result.stdout | default('') | trim | length == 0
  no_log: true

- name: Show call secrets to operator (save these now)
  become: false
  debug:
    msg: |
      ==============================================================
      LIVEKIT CALL SERVER SECRETS — save these now, they are not
      persisted anywhere outside the server.
      ==============================================================
      {{ call_secrets_result.stdout }}
      ==============================================================
  # Ansible's default verbosity prints `debug` messages; still, mark this
  # as explicitly readable by setting no_log=false.
  no_log: false

- name: Verify call containers are running
  become: false
  shell: docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | wc -l
  args:
    executable: /bin/bash
  register: call_container_count
  changed_when: false

- name: Fail if no call containers are running
  fail:
    msg: "No containers running after `ibl call start` — check ECR pull / disk space / compose file."
  when: (call_container_count.stdout | int) == 0
