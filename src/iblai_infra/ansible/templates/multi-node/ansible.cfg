[defaults]
inventory = ./inventory.ini
# ./roles holds the multi-node roles; ./shared_roles is the single-server
# template's roles, copied in by AnsibleRunner so both topologies run the
# same docker / python / platform / DM / edX code.
roles_path = ./roles:./shared_roles
host_key_checking = False
timeout = 120
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20
