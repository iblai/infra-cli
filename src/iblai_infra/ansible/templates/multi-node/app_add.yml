---
# `iblai infra app add`: another app node, cloned from the hub. Then the
# stores firewall is rewritten so it admits the new node too.
- ansible.builtin.import_playbook: facts.yml

- name: Clone the hub onto the new app node
  hosts: new_apps
  become: true
  pre_tasks:
    - name: Install the base software
      include_role:
        name: mn_base
      vars:
        mn_stop_stock_nginx: true

    - name: Copy the hub's root
      include_role:
        name: mn_sync
        tasks_from: files
      vars:
        mn_sync_files: [config.yml, services.yml, secrets.yml]

    - name: Copy the hub's static overrides
      include_role:
        name: mn_sync
        tasks_from: static
  roles:
    - mn_clone

- name: Admit the new node through the stores firewall
  hosts: stores
  become: true
  tasks:
    - name: Rewrite the store firewall
      include_role:
        name: mn_stores_node
        tasks_from: firewall

- name: Check the secrets match
  hosts: app_nodes:stores
  tasks:
    - name: Compare secrets.yml
      include_role:
        name: mn_sync
        tasks_from: verify
