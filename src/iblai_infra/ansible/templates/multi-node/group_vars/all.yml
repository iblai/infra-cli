---
# Shared by every multi-node playbook. Per-run values (hosts' roles, store
# layout, credentials) arrive as --extra-vars from AnsibleRunner; per-host
# `node_id` comes from the inventory.
python_version: "3.11.8"
venv_name: "ibl-cli-ops"
ibl_root: /ibl
repo_dir: "/home/{{ ansible_user }}/ibl-cli-ops"
pyenv_root: "/home/{{ ansible_user }}/.pyenv"
bashrc_path: "/home/{{ ansible_user }}/.bashrc"
docker_arch: >-
  {{ 'amd64' if ansible_architecture == 'x86_64'
     else 'arm64' if ansible_architecture == 'aarch64'
     else ansible_architecture }}

# Prefix for every shell task that runs `ibl`: the venv the python role made.
ibl_env: |
  export PYENV_ROOT="{{ pyenv_root }}"
  export PATH="$PYENV_ROOT/bin:$PATH"
  eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
  pyenv activate "{{ venv_name }}"

# Where the image registry lives - the same one the single-server roles log in to.
ecr_registry: 765174860755.dkr.ecr.us-east-1.amazonaws.com
ecr_region: us-east-1

# Private address the app nodes use to reach the stores node. Empty = the
# stores node's default IPv4 address, read from its facts.
stores_private_ip: ""

# Store layout: "managed" (an endpoint the operator supplies) or "stores"
# (runs on the stores node). MongoDB, Meilisearch, ClickHouse and MinIO
# always run on the stores node.
mysql_location: stores
postgres_location: stores
redis_edx_location: stores
redis_dm_location: stores

# Managed endpoints - only read for a store whose location is "managed".
mysql_host: ""
mysql_port: 3306
mysql_root_username: admin
postgres_host: ""
postgres_port: 5432
postgres_admin_username: postgres
postgres_tls: true
redis_edx_host: ""
redis_edx_port: 6379
redis_edx_tls: true
redis_dm_host: ""
redis_dm_port: 6379
redis_dm_tls: true

# Fixed ports the stores node publishes for the app nodes. edX Redis moves
# to 6380 so it can share the stores node with the DM's Redis on 6379, and
# MinIO's API to 9090 (9000 is ClickHouse's native port).
stores_redis_edx_port: 6380
stores_minio_port: 9090

# MongoDB runs with --auth; its root login is kept on the stores node only.
mongodb_auth: true
mongodb_app_username: edxapp
mongodb_root_env_file: /etc/ibl/mongodb-root.env

# "auto" turns TimescaleDB off when the DM's Postgres is managed (managed
# Postgres services rarely ship the extension). true / false force it.
timescaledb: auto
enable_timescaledb: >-
  {{ (timescaledb | string | lower) in ['true', 'yes', '1']
     or ((timescaledb | string | lower) == 'auto' and postgres_location == 'stores') }}

# The app nodes' service set: edX, the DM without stores or beat, and the
# SPAs the single-server preset runs. AI calls stay off until a call server
# is connected (`iblai infra call connect`).
app_services:
  - IBL_SERVICES.IBL_EDX
  - IBL_SERVICES.IBL_DM
  - IBL_EDX.RUN_LMS
  - IBL_EDX.RUN_CMS
  - IBL_EDX.RUN_MFE
  - IBL_DM.RUN_AI_BOT
  - IBL_DM.RUN_AI_AGENT_WORKER
  - IBL_DM.RUN_CREDITS_WORKER
  - IBL_DM.RUN_AI_PLAYWRIGHT_WORKER
  - IBL_DM.RUN_ASGI_WEB
  - IBL_DM.RUN_LANGFUSE_WEB
  - IBL_DM.RUN_LANGFUSE_WORKER
  - IBL_DM.RUN_WEB
  - IBL_DM.RUN_WORKER
  - IBL_DM.RUN_NOTIFICATION_WORKER
  - IBL_UTILITY.PROMETHEUS.RUN_GRAFANA
  - IBL_SPA.RUN_AUTH_SPA
  - IBL_SPA.RUN_LMS_SPA
  - IBL_SPA.RUN_OS_SPA

# Sandbox server. The domain is the load balancer hostname that routes to
# it; the DM reaches it there over HTTPS.
sandbox_domain: "sandbox.{{ base_domain }}"
sandbox_max_sessions: 20
# The DM's tenant on the sandbox and its API key.
sandbox_tenant: dm
sandbox_key_label: dm-backend
sandbox_key_days: 90
sandbox_egress_profiles: [none]
# Image the DM asks for. Empty = the guest image ref the sandbox reports.
sandbox_dm_image: ""
# Moves every mentor on the DM to the graph runner, the one that can use a VM.
sandbox_graph_agents: true
# `platform:mentor name` pairs to turn VMs on for, and their egress profile.
sandbox_vm_mentors: []
sandbox_vm_egress: none

# Load balancer idle timeout the platform nginx must outlast (AWS advises
# target keep-alive above it). 700 s covers a 660 s ALB idle timeout, which
# the sandbox needs when it shares the platform's load balancer.
nginx_keepalive_timeout: 700

# Derived from the inventory and facts (every playbook gathers facts on all
# hosts first): the stores node's private address, and the app nodes'
# addresses the stores firewall admits.
mn_stores_ip: >-
  {{ stores_private_ip if stores_private_ip else
     hostvars[groups['stores'][0]]['ansible_default_ipv4']['address'] }}
mn_app_ips: >-
  {{ groups['app_nodes'] | map('extract', hostvars) | selectattr('ansible_default_ipv4', 'defined')
     | map(attribute='ansible_default_ipv4') | map(attribute='address') | list }}
