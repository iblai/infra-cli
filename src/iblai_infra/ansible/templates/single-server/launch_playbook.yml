---
- name: Launch IBL Platform from AMI
  hosts: ibl_servers
  become: true

  vars:
    python_version: "3.11.8"
    venv_name: "ibl-cli-ops"
    ibl_root: /ibl
    repo_dir: "/home/{{ ansible_user }}/ibl-cli-ops"
    pyenv_root: "/home/{{ ansible_user }}/.pyenv"
    bashrc_path: "/home/{{ ansible_user }}/.bashrc"
    docker_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64'
         else 'arm64' if ansible_architecture == 'aarch64'
         else ansible_architecture }}

  pre_tasks:
    - name: Ensure IBL root contents owned by ansible user
      shell: chown -Rh {{ ansible_user }}:{{ ansible_user }} {{ ibl_root }}/ 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # Legacy-layout guard: auth.yml only exists under the 5.x two-file
    # config layout, which these templates no longer speak. Old 5.x AMIs
    # fail here fast; new AMIs must be baked from a 6.x-provisioned server.
    - name: Check for legacy 5.x config layout
      stat:
        path: "{{ ibl_root }}/auth.yml"
      register: legacy_auth_yml
      tags: always

    - name: Fail on unmigrated legacy 5.x root
      fail:
        msg: >-
          {{ ibl_root }}/auth.yml exists - this server still runs the
          legacy 5.x config layout. Migrate it to the 6.x layout first
          (operator runbook: docs/CONFIG_MIGRATION.md in ibl-cli-ops),
          then re-run this command.
      when: legacy_auth_yml.stat.exists
      tags: always

  roles:
    - ibl_cli_ops
    - ibl_launch
    - smtp_config
    - ibl_launch_services
    - integrations
    - admin_setup
    - data_seeding
    - ibl_tenant_platform
    - stripe_config
    - google_sso_config
    - microsoft_sso_config

  tasks:
    - name: Set up Playwright test platforms
      ansible.builtin.include_role:
        name: playwright_test_platforms
      when: create_playwright_platforms | default(false) | bool

  post_tasks:
    # Final unconditional proxy reload. Runs AFTER every role and the
    # optional Playwright include, so any nginx state touched by SSO
    # roles (edX restarts in google_sso_config / microsoft_sso_config)
    # is picked up before the playbook exits. Mirrors the post_tasks
    # block in playbook.yml so `launch` / `launch-env` get the same
    # final-reload guarantee that `setup` / `setup-env` already have.
    - name: Reload global proxy (final step)
      become: false
      ansible.builtin.shell: |
        export PYENV_ROOT="{{ pyenv_root }}"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
        pyenv activate "{{ venv_name }}"
        ibl global-proxy reload
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      environment:
        HOME: "/home/{{ ansible_user }}"
        IBL_ROOT: "{{ ibl_root }}/"
        NODE_ID: "{{ node_id }}"
