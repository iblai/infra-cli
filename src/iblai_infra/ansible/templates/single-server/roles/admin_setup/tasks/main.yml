---
# Tagged `llm` so it can be run on its own against a bootstrapped server -
# `iblai infra llm set-key <name>`. `update_or_create` makes that safe to
# repeat, and the credential is read live by the mentor service, so no
# restart is needed for a later change to take effect.
# The credential row has two columns holding the same secret: `value`
# (plaintext) and `value_encrypted`. Newer platform versions read the
# encrypted column as the sole source of truth and do NOT fall back to the
# plaintext one, so writing only `value` - as this task used to - leaves the
# key inert on a fresh install, and on a rotation leaves the OLD key in force
# while the CLI reports success. The platform's own backfill migration copies
# plaintext into encrypted only when encrypted is empty, so it does not repair
# a rotation either. Both columns are therefore written together, with the
# same {"key": "..."} payload.
#
# The columns are looked up on the model rather than assumed: `value_encrypted`
# does not exist on older deployments, and naming it there would fail the task.

# The key and the provider are both interpolated into the command below, which
# is a Python program inside a double-quoted shell string. A quote ends the
# Python literal, a double quote ends the shell string, and `$(...)` is
# substituted by the shell before the command runs. The CLI already restricts
# both values; this repeats the check so the role does not depend on its caller
# having done so.
- name: Refuse a key or provider that could carry shell or Python syntax
  ansible.builtin.assert:
    that:
      - llm_api_key is match('^[A-Za-z0-9_.\-]+$')
      - llm_provider in ['openai', 'anthropic']
    fail_msg: >-
      Refusing to write the credential: an API key may only contain letters,
      numbers, dashes, underscores and dots, and the provider must be openai
      or anthropic.
    quiet: true
  no_log: true
  when: llm_api_key | length > 0
  tags: [llm]

- name: Configure the LLM credential
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py shell -c "
    from ibl_ai_mentor.models import GlobalCredential
    value = {'key': '{{ llm_api_key }}'}
    columns = {f.name for f in GlobalCredential._meta.get_fields()}
    defaults = {'is_preferred': True}
    for column in ('value', 'value_encrypted'):
        if column in columns:
            defaults[column] = value
    GlobalCredential.objects.update_or_create(name='{{ llm_provider }}', defaults=defaults)
    GlobalCredential.objects.exclude(name='{{ llm_provider }}').update(is_preferred=False)
    print('LLM credential configured: {{ llm_provider }}')
    "
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  # The key is interpolated into the command, which Ansible echoes when a task
  # fails. Without this a failed run prints the key to the terminal and into
  # any CI log capturing it.
  no_log: true
  when: llm_api_key | length > 0
  tags: [llm]

- name: Create DM super admin
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py shell -c "
    from django.contrib.auth.models import User
    if not User.objects.filter(username='{{ admin_username }}').exists():
        User.objects.create_superuser('{{ admin_username }}', '{{ admin_email }}', '{{ admin_password }}')
        print('DM superuser created')
    else:
        u = User.objects.get(username='{{ admin_username }}')
        u.email = '{{ admin_email }}'
        u.set_password('{{ admin_password }}')
        u.is_superuser = True
        u.is_staff = True
        u.save()
        print('DM superuser updated')
    "
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  no_log: true

# LMS superuser must have first_name + last_name + UserProfile.name set,
# otherwise skills/enrollment flows that look up the learner's display name
# render blank and (in some flows) reject the enrollment outright. We
# derive a default first/last from the admin_username (snake/kebab/dot →
# title-cased words) and only fill empty fields so a hand-edited name
# isn't clobbered on re-runs.
- name: Create LMS super admin (with first_name / last_name / UserProfile.name)
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c "
    from django.contrib.auth.models import User
    from common.djangoapps.student.models import UserProfile

    parts = '{{ admin_username }}'.replace('_', ' ').replace('-', ' ').replace('.', ' ').title().split()
    default_first = parts[0] if parts else 'Admin'
    default_last = ' '.join(parts[1:]) if len(parts) > 1 else 'User'

    u, created = User.objects.get_or_create(
        username='{{ admin_username }}',
        defaults={'email': '{{ admin_email }}'},
    )
    if created:
        print('LMS superuser created')
    else:
        u.email = '{{ admin_email }}'
        print('LMS superuser updated')
    u.set_password('{{ admin_password }}')
    u.is_superuser = True
    u.is_staff = True
    if not u.first_name:
        u.first_name = default_first
    if not u.last_name:
        u.last_name = default_last
    u.save()

    profile, _ = UserProfile.objects.get_or_create(
        user=u,
        defaults={'name': f'{u.first_name} {u.last_name}'.strip()},
    )
    if not profile.name or not profile.name.strip():
        profile.name = f'{u.first_name} {u.last_name}'.strip() or u.username
        profile.save()
        print('LMS superuser UserProfile.name set')
    "
  args:
    executable: /bin/bash
  no_log: true

- name: Seed CSRF exempt domains for CORS
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c "
    from ibl_ai_edx_sso_backend.models import CsrfExemptDomain
    domains = [
        'learn.{{ base_domain }}',
        'preview.learn.{{ base_domain }}',
        'studio.learn.{{ base_domain }}',
        'apps.learn.{{ base_domain }}',
        'meilisearch.learn.{{ base_domain }}',
        'api.data.{{ base_domain }}',
        'api.{{ base_domain }}',
        'asgi.data.{{ base_domain }}',
        'llm.data.{{ base_domain }}',
        'base.manager.{{ base_domain }}',
        'auth.{{ base_domain }}',
        'os.{{ base_domain }}',
        'monitor.{{ base_domain }}',
        'flowise.{{ base_domain }}',
        'lms.{{ base_domain }}',
        'platform.{{ base_domain }}',
        'prometheus.{{ base_domain }}',
        'web.{{ base_domain }}',
        'discovery.{{ base_domain }}',
        'notes.{{ base_domain }}',
        'mfe.{{ base_domain }}',
        'status.{{ base_domain }}',
    ]
    created = 0
    for d in domains:
        _, was_created = CsrfExemptDomain.objects.get_or_create(domain=d)
        if was_created:
            created += 1
    print(f'CSRF exempt domains: {created} created, {len(domains) - created} already existed')
    "
  args:
    executable: /bin/bash

- name: Enable main platform to use main LLM key
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py shell -c "
    from ibl_ai_mentor.models import UseMainLLMKey
    from core.models import Platform
    platform = Platform.objects.get(key='main')
    UseMainLLMKey.objects.update_or_create(
        platform=platform,
        defaults={'use_main_key': True},
    )
    print('UseMainLLMKey configured for main platform')
    "
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
