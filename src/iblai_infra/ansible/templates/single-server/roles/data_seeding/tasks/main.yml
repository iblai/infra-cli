---
- name: Seed DM flows
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py seed_flows
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

# Some of the mentors `seed_flows` creates, the health check's among them, get
# no settings row, and chat with them fails reading it.
- name: Give every mentor a settings row
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py shell <<'PY'
      from ibl_ai_mentor.models import Mentor
      from ibl_ai_mentor.utils.mentor_utils import get_or_create_mentor_settings

      missing = Mentor.objects.filter(mentorsettings__isnull=True)
      created = [m.name for m in missing if get_or_create_mentor_settings(m)[1]]
      print("MENTOR_SETTINGS_CREATED " + ", ".join(created) if created else "MENTOR_SETTINGS_PRESENT")
      PY
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  register: mentor_settings
  changed_when: "'MENTOR_SETTINGS_CREATED' in mentor_settings.stdout"

# The health-check mentors are seeded with the legacy `fake-llm` provider,
# which only long-lived installs still have a row for; on a fresh one the
# mentor health check, and the readiness gate of `ibl dm update`, fail.
- name: Register the provider the health-check mentors use
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py shell <<'PY'
      from django.apps import apps

      try:
          LLM = apps.get_model("ibl_ai_mentor", "LLM")
      except LookupError:
          LLM = None
      if LLM is None:
          print("FAKE_LLM_PROVIDER_NOT_NEEDED")
      else:
          description = "Fake llm used for testing purposes"
          chat_models = [{"llm_name": "fake-llm-model", "description": "", "is_multimodal": False,
                          "training_data": "", "context_window": "infinite"}]
          _, created = LLM.objects.get_or_create(
              name="fake-llm",
              defaults={
                  "description": description,
                  "chat_models": chat_models,
                  "flow": {"name": "fake-llm", "display_name": "Fake LLM", "description": description,
                           "chat_models": chat_models},
              },
          )
          print("FAKE_LLM_PROVIDER_CREATED" if created else "FAKE_LLM_PROVIDER_PRESENT")
      PY
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  register: fake_llm_provider
  changed_when: "'FAKE_LLM_PROVIDER_CREATED' in fake_llm_provider.stdout"

- name: Seed LLM registry
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py seed_llm_registry
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

# Current DM releases no longer ship this command.
- name: Seed base mentors
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/
      COMMANDS=$(docker compose exec -T web ./manage.py help --commands) || exit 1
      if ! grep -qx seed_base_mentors <<< "$COMMANDS"; then
        echo "SEED_BASE_MENTORS_UNAVAILABLE"
        exit 0
      fi
      docker compose exec -T web ./manage.py seed_base_mentors
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  register: seed_base_mentors
  changed_when: "'SEED_BASE_MENTORS_UNAVAILABLE' not in seed_base_mentors.stdout"

- name: Seed tools
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py seed_tools
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

# Seeds the Open edX demo course into the LMS/CMS (tutor's bundled course).
# Runs AFTER the DM seeders and BEFORE RBAC, so RBAC's tenant-scoped role
# wiring runs against a fully-populated edX install.
# `ibl tutor local do importdemocourse` is the supported wrapper for
# `tutor local do importdemocourse` — it inherits IBL_ROOT-aware paths.
- name: Seed Open edX demo course
  become: false
  ansible.builtin.shell:
    cmd: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"
      eval "$(pyenv virtualenv-init -)"
      pyenv activate "{{ venv_name }}"
      ibl tutor local do importdemocourse
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# Skills enrollment + several other edX flows look up the learner's display
# name from `auth_user.first_name` / `last_name` and `student.UserProfile.name`.
# Test users created by `importdemocourse` (`staff`, `honor`, `audit`,
# `verified`, etc.) and any users created by RBAC seeding ship with empty
# name fields. Sweep ALL users and fill the blanks from the username so
# downstream lookups always have a string to render. Idempotent — only
# touches rows where the field is empty.
- name: Backfill empty first_name / last_name / UserProfile.name on LMS users
  become: false
  ansible.builtin.shell:
    cmd: |
      docker exec ibl_prod_lms ./manage.py lms shell -c "
      from django.contrib.auth.models import User
      from common.djangoapps.student.models import UserProfile

      fixed_user = 0
      fixed_profile = 0
      for u in User.objects.all():
          parts = u.username.replace('_', ' ').replace('-', ' ').replace('.', ' ').title().split()
          first = parts[0] if parts else 'User'
          last = ' '.join(parts[1:]) if len(parts) > 1 else u.username
          changed = False
          if not u.first_name:
              u.first_name = first
              changed = True
          if not u.last_name:
              u.last_name = last
              changed = True
          if changed:
              u.save()
              fixed_user += 1
          profile, was_created = UserProfile.objects.get_or_create(
              user=u,
              defaults={'name': f'{u.first_name} {u.last_name}'.strip() or u.username},
          )
          if not profile.name or not profile.name.strip():
              profile.name = f'{u.first_name} {u.last_name}'.strip() or u.username
              profile.save()
              fixed_profile += 1
          elif was_created:
              fixed_profile += 1
      print(f'Backfilled: {fixed_user} auth_user rows, {fixed_profile} UserProfile rows')
      "
    executable: /bin/bash

# Magic-link login uses LMS email templates (subject + HTML body) for sending
# the one-time login links that test users (and any other passwordless flow)
# rely on. The defaults ship with `ibl_edx_magic_link_login` but are not
# auto-loaded into the DB on first boot. They must be seeded by invoking the
# Command class directly — `./manage.py setup_default_templates` collides
# with another app's command of the same name, so we import + call handle()
# in `lms shell` instead. force=True overwrites any stale templates from
# prior runs so the canonical defaults always win, which makes the task
# safely idempotent across re-runs.
- name: Seed magic-link login default email templates
  become: false
  ansible.builtin.shell:
    cmd: |
      docker exec -i ibl_prod_lms ./manage.py lms shell <<'PY'
      from ibl_edx_magic_link_login.management.commands.setup_default_templates import Command
      Command().handle(force=True)
      print("MAGIC_LINK_TEMPLATES_DONE")
      PY
    executable: /bin/bash
  register: magic_link_templates_result
  changed_when: "'MAGIC_LINK_TEMPLATES_DONE' in (magic_link_templates_result.stdout | default(''))"

# RBAC must run last — it consumes the resources created by the preceding
# seeders (flows, llm-registry, base-mentors, tools) when wiring up group
# memberships and permissions. Re-ordering will leave the platform without
# the correct role/permission mappings for anything seeded after it.
- name: Seed RBAC data
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py seed_rbac_data
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

- name: Setup TimescaleDB views
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && echo "y" | docker compose exec -T web ./manage.py setup_timescale_views --full-setup
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  register: setup_timescale_result
  # Surface the real failure instead of swallowing it (was `ignore_errors: true`,
  # which hid the missing-`timescaledb`-extension case entirely). The extension is
  # now created in the ibl_dm role, so this should succeed; fail loudly on a genuine
  # error (Python traceback) while tolerating benign non-zero exits / idempotent re-runs.
  failed_when: >-
    setup_timescale_result.rc != 0 and
    ('Traceback' in (setup_timescale_result.stdout | default('') ~ setup_timescale_result.stderr | default('')))

- name: Show TimescaleDB views setup result
  ansible.builtin.debug:
    var: setup_timescale_result.stdout_lines
  when: setup_timescale_result.stdout_lines is defined

- name: Recreate analytics views
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py refresh_analytics_views --recreate
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

- name: Refresh analytics views
  become: false
  ansible.builtin.shell:
    cmd: |
      cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py refresh_analytics_views
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
