---
- name: Install iblai-cli-ops
  ansible.builtin.import_tasks: install.yml

# Initialize the 6.x config root. Idempotent — rc 0 no-op on an existing
# root (it prints "use `ibl services set-from` to change presets"), so
# this is safe for setup, resetup, launch and service-update alike. The
# upstream single-server preset owns the canonical service list; updating
# the preset updates deployments, no disable list here.
- name: Initialize IBL config root (single-server preset)
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl init --from single-server
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# Some secrets default to another secret (e.g. IBL_DM.DB_READ_REPLICA_PASSWORD
# to IBL_DM.DB_PASSWORD), so on a fresh root they read as operator-supplied
# until the generated ones exist. Fill those first; present values are kept.
- name: Generate missing secrets
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets generate
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# Fail-fast gate: any gate-active secret with no generator must be
# supplied by an operator, and nothing later in the playbook would fill
# it. rc 1 alone is NOT a failure here — it also fires for generatable
# secrets that `ibl secrets generate` fills later in the run — so key the
# check on `user_supplied` only.
- name: Preflight - check for missing operator-supplied secrets
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"
    eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets check --json
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: secrets_check
  changed_when: false
  failed_when: (secrets_check.stdout | from_json).user_supplied | length > 0
