---
# The rows `ibl dm auth-setup` and `ibl dm launch` create, brought in line with
# the current config instead: upstream's helpers only create, so they fail or
# skip once a row exists, and a resetup's rotated clients never reach the DM.
- name: Register the DM OAuth credentials
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    set -o pipefail
    DM_CREDENTIALS=$(python3 - <<'PY' | tail -n 1
    import json
    import os

    import click

    from ibl.cli import cli, setup

    ctx = click.Context(cli)
    with ctx:
        setup(ctx, os.environ["IBL_ROOT"])
        c = ctx.obj.config
        edx, dm = c.IBL_OAUTH.IBL_EDX, c.IBL_OAUTH.IBL_DM
        dm_client = {"client_id": dm.CLIENT_ID, "client_secret": dm.CLIENT_SECRET}
        analytics_token = c.IBL_AXD_WEB_ANALYTICS.ADMIN_TOKEN
        print(json.dumps({
            "admin_user": c.IBL_AUTH_USER,
            "application": {
                "name": c.IBL_DM.IBL_EDX_TOKEN_APP_ID,
                "client_id": edx.CLIENT_ID,
                "client_secret": edx.CLIENT_SECRET,
                "client_type": edx.CLIENT_TYPE,
                "authorization_grant_type": edx.AUTHORIZATION_GRANT_TYPE,
                "redirect_uris": edx.REDIRECT_URIS,
                "post_logout_redirect_uris": edx.REDIRECT_URIS,
                "skip_authorization": edx.SKIP_AUTHORIZATION,
            },
            "manager_credentials": [
                {"app_id": "edx", "client_id": edx.CLIENT_ID, "client_secret": edx.CLIENT_SECRET,
                 "token_type": "bearer", "token_endpoint": c.IBL_DM.EDX_TOKEN_URL},
                {"app_id": c.IBL_DM.IBL_MATOMO_TOKEN_APP_ID, "client_id": analytics_token,
                 "client_secret": analytics_token, "token_type": "bearer",
                 "token_endpoint": f"https://{c.IBL_AXD_WEB_ANALYTICS.HOST}"},
            ],
            "api_credentials": [
                {"app_id": "ibl-edx-lms", "access_token_url": c.IBL_DM.LMS_TOKEN_URL, **dm_client},
                {"app_id": "ibl-edx-cms", "access_token_url": c.IBL_DM.CMS_TOKEN_URL, **dm_client},
                {"app_id": "ibl-dm", "access_token_url": f"{c.IBL_DM.DM_URL}/oauth/token/", **dm_client},
            ],
            "ai_user": bool(c.IBL_DM.ENABLE_IBL_AI),
        }, default=str))
    PY
    ) || exit 1
    export DM_CREDENTIALS
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro
    docker compose run --rm -T -e DM_CREDENTIALS cli python manage.py shell <<'PY'
    import json
    import os

    from core.models import OAuthCredentials as ManagerCredentials
    from django.conf import settings
    from django.contrib.auth import get_user_model
    from django.contrib.auth.hashers import check_password
    from django.core.management import call_command
    from django.db import connection
    from ibl_api_auth.models import OAuthCredentials as ApiCredentials
    from oauth2_provider.models import Application
    from psycopg import sql

    data = json.loads(os.environ["DM_CREDENTIALS"])
    changed = []


    def differs(row, fields):
        return any(getattr(row, k) != row._meta.get_field(k).to_python(v) for k, v in fields.items())


    def converge(model, app_id, **fields):
        row, created = model.objects.get_or_create(app_id=app_id)
        if created or differs(row, fields):
            for k, v in fields.items():
                setattr(row, k, v)
            # A cached token was issued to the old client.
            row.access_token, row.created_on, row.expires_on = "", None, None
            row.save()
            changed.append(app_id)


    for cred in data["manager_credentials"]:
        converge(ManagerCredentials, **cred)
    for cred in data["api_credentials"]:
        converge(ApiCredentials, **cred)

    # The stored secret is hashed, so it is checked rather than compared.
    fields = dict(data["application"])
    secret = fields.pop("client_secret")
    user = get_user_model().objects.get(username=data["admin_user"])
    app = (
        Application.objects.filter(client_id=fields["client_id"]).first()
        or Application.objects.filter(name=fields["name"]).first()
        or Application()
    )
    stored = app.client_secret or ""
    if app.pk is None or app.user_id != user.pk or differs(app, fields) or not (
        stored == secret or check_password(secret, stored)
    ):
        for k, v in fields.items():
            setattr(app, k, v)
        app.user, app.client_secret = user, secret
        app.save()
        changed.append(fields["name"])

    if data["ai_user"]:
        role = settings.READ_ONLY_USER
        with connection.cursor() as cursor:
            cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", [role])
            exists = cursor.fetchone() is not None
            if exists:
                cursor.execute(
                    sql.SQL("ALTER ROLE {} WITH PASSWORD %s").format(sql.Identifier(role)),
                    [settings.READ_ONLY_PASSWORD],
                )
        if not exists:
            call_command("create_ai_user")
            changed.append("ai_user")

    print("DM_CREDENTIALS_CHANGED " + " ".join(changed) if changed else "DM_CREDENTIALS_UNCHANGED")
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: dm_credentials
  changed_when: "'DM_CREDENTIALS_CHANGED' in dm_credentials.stdout"
  no_log: true
