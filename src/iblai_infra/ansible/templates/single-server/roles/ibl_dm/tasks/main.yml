---
- name: Ensure DM postgres data directory has correct ownership
  file:
    path: "{{ ibl_root }}/app/ibl-dm/ibl-dm-pro/data/postgres"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
    recurse: true

- name: Pull latest DM postgres image and recreate database container
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose pull dm-data && docker compose up -d --force-recreate dm-data
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

- name: Wait for postgres to be ready
  become: false
  shell: |
    docker exec ibl_dm_db bash -c 'pg_isready -U "$POSTGRES_USER"'
  args:
    executable: /bin/bash
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2

- name: Enable pgvector extension
  become: false
  shell: |
    docker exec ibl_dm_db bash -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS vector;"'
  args:
    executable: /bin/bash
  register: pgvector_result

- name: Show pgvector result
  debug:
    var: pgvector_result.stdout_lines
  when: pgvector_result.stdout_lines is defined

# TimescaleDB ships preloaded in the DM postgres image
# (shared_preload_libraries=timescaledb) but the extension is never created
# unless we do it here. Without it, `setup_timescale_views` (data_seeding)
# silently degrades and analytics hypertables are never built. Idempotent.
- name: Enable TimescaleDB extension
  become: false
  shell: |
    docker exec ibl_dm_db bash -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"'
  args:
    executable: /bin/bash
  register: timescaledb_result

- name: Show TimescaleDB extension result
  debug:
    var: timescaledb_result.stdout_lines
  when: timescaledb_result.stdout_lines is defined

# `ibl dm launch` can't bootstrap this server on cli-ops >= 7.13, where a
# failing sub-step fails the command: it execs into `web` before anything
# starts it, runs `ibl dm sso` before edX exists, runs Kafka and web
# analytics steps this preset has no services for, and its createsuperuser
# can't re-run. Its steps follow in a working order, each safe to repeat;
# `ibl dm sso` runs from the integrations role, after edX.
- name: Migrate the DM database
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl dm migrate
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Ensure the DM admin user exists
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    DM_ADMIN_USER=$(ibl config get IBL_AUTH_USER) || exit 1
    DM_ADMIN_EMAIL=$(ibl config get IBL_AUTH_EMAIL) || exit 1
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro
    docker compose run --rm -T -e DM_ADMIN_USER="$DM_ADMIN_USER" -e DM_ADMIN_EMAIL="$DM_ADMIN_EMAIL" \
      cli python manage.py shell <<'PY'
    import os
    from django.contrib.auth import get_user_model
    User = get_user_model()
    if not User.objects.filter(username=os.environ["DM_ADMIN_USER"]).exists():
        User.objects.create_superuser(os.environ["DM_ADMIN_USER"], os.environ["DM_ADMIN_EMAIL"], None)
        print("DM_ADMIN_CREATED")
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: dm_admin
  changed_when: "'DM_ADMIN_CREATED' in dm_admin.stdout"

# Before anything starts: with notifications on, the web container loads
# fixtures that reference the main platform this creates.
- name: Initialize the DM manager
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro && docker compose run --rm cli python manage.py initialize_manager --local
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

- name: Start the DM services
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl dm up -d 2>&1
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 3600

- name: Verify DM containers are running
  become: false
  shell: docker ps --filter "name=ibl_dm" --format "{{ '{{' }}.Names{{ '}}' }}" 2>&1
  args:
    executable: /bin/bash
  register: dm_containers

- name: Show running DM containers
  debug:
    var: dm_containers.stdout_lines

- name: Fail if no DM containers are running
  fail:
    msg: >-
      No ibl-dm-pro containers found after launch.
      Check the 'Start the DM services' output above for errors
      (common cause: missing ibl_local_default docker network).
  when: dm_containers.stdout | trim | length == 0

- name: Wait for DM web to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:8400/ 2>/dev/null | grep -qE '^(200|301|302|404)$'
  args:
    executable: /bin/bash
  register: dm_health
  until: dm_health.rc == 0
  retries: 40
  delay: 15

# Restarts during the last minute, not the lifetime count: a re-run after a
# failed attempt would otherwise fail on restarts that have since stopped.
- name: Check DM web container is not crash-looping
  become: false
  shell: |
    BEFORE=$(docker inspect --format '{{ '{{' }}.RestartCount{{ '}}' }}' ibl_dm_pro_web)
    sleep 60
    AFTER=$(docker inspect --format '{{ '{{' }}.RestartCount{{ '}}' }}' ibl_dm_pro_web)
    echo "$((AFTER - BEFORE))"
  args:
    executable: /bin/bash
  register: dm_restart_count
  changed_when: false

- name: Fail if DM web is crash-looping
  fail:
    msg: >-
      ibl_dm_pro_web restarted {{ dm_restart_count.stdout | trim }} times in the last minute.
      Run 'docker logs ibl_dm_pro_web' on the server to diagnose.
      Common cause: missing database migrations — try 'ibl dm migrate'.
  when: dm_restart_count.stdout | trim | int > 0

# Upstream's own helpers, called directly so the steps above stay in charge
# of ordering: the OAuth rows and application the DM uses to reach edX, the
# DM's token endpoints for LMS, CMS and itself, and the AI service user.
- name: Register the DM OAuth credentials
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    python3 - <<'PY'
    import os

    import click

    from ibl.cli import cli, setup
    from ibl.tasks.dm_task import DmTaskRunner
    from ibl.utils.dm_utils import manager_credential_setup

    ctx = click.Context(cli)
    with ctx:
        setup(ctx, os.environ["IBL_ROOT"])
        config = ctx.obj.config
        task = DmTaskRunner(ctx)
        manager_credential_setup(task.absolute_app_directory, config)
        task.configure_oauth_credentials()
        if config.IBL_DM.ENABLE_IBL_AI:
            task.create_ai_user()
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  no_log: true
