---
# ---------------------------------------------------------------------------
# ECR login
# ---------------------------------------------------------------------------

- name: Login to ECR
  become: false
  shell: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 765174860755.dkr.ecr.us-east-1.amazonaws.com
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_default_region }}"

# ---------------------------------------------------------------------------
# DM restart
# ---------------------------------------------------------------------------

- name: Update DM services
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render && ibl dm update
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 3600

- name: Wait for DM web to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:8400/ 2>/dev/null | grep -qE '^(200|301|302|404)$'
  args:
    executable: /bin/bash
  register: dm_health
  until: dm_health.rc == 0
  retries: 40
  delay: 15

# ---------------------------------------------------------------------------
# edX restart
# ---------------------------------------------------------------------------

- name: Stop edX services
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl edx stop
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 600
  ignore_errors: true

- name: Prune stopped containers
  become: false
  shell: docker system prune -f
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

- name: Render config for edX
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Start edX services
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl edx start -d
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 3600

- name: Wait for LMS to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:8600/heartbeat 2>/dev/null | grep -qE '^(200|301|302|404)$'
  args:
    executable: /bin/bash
  register: lms_health
  until: lms_health.rc == 0
  retries: 40
  delay: 15

# ---------------------------------------------------------------------------
# SPA config — flip stripe / advertising off by default (override the
# values baked into the AMI's config.yml). Matches the fresh-install
# defaults set in `ibl_spa`; both keys are str-typed in the registry, so
# `ibl config set` stores the exact 'false' strings.
# ---------------------------------------------------------------------------

- name: Set SPA boolean defaults
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config set \
      'IBL_SPA.MENTOR.STRIPE_ENABLED=false' \
      'IBL_SPA.MENTOR.ENABLE_ADVERTISING=false'
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Render templates with SPA config defaults
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# ---------------------------------------------------------------------------
# SPA restart
# ---------------------------------------------------------------------------

- name: Discover enabled SPAs
  ansible.builtin.import_role:
    name: ibl_spa
    tasks_from: discover

- name: Restart enabled SPAs
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-spa/{{ item.name }}/ && docker compose pull && docker compose down && docker compose up -d
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  loop: "{{ enabled_spas }}"
  retries: 2
  delay: 5

# 30 x 15s per SPA - the SPA image runs `pnpm install` on first boot before
# Next.js starts (see ibl_spa). All were restarted above, so the waits overlap.
- name: Wait for enabled SPAs to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:{{ item.port }}/ 2>/dev/null | grep -qE '^(200|301|302)$'
  args:
    executable: /bin/bash
  register: spa_health
  until: spa_health.rc == 0
  retries: 30
  delay: 15
  loop: "{{ enabled_spas }}"

# ---------------------------------------------------------------------------
# Proxy reload
# ---------------------------------------------------------------------------

- name: Render config and reload proxy
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render && ibl global-proxy reload
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
