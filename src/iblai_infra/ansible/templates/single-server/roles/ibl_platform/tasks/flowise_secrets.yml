---
# `ibl dm up` requires these four secrets whenever AI is on, but they are
# generated only when RUN_FLOWISE is, which the single-server preset leaves
# off. `ibl secrets rotate` fills them regardless of that gate; only empty
# ones are written, so a re-run keeps the values already in use.
- name: Fill the Flowise secrets the DM start-up requires
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    AI=$(ibl config get IBL_DM.ENABLE_IBL_AI) || exit 1
    AI_PLUS=$(ibl config get IBL_DM.ENABLE_IBL_AI_PLUS) || exit 1
    if [ "$AI" != "True" ] && [ "$AI_PLUS" != "True" ]; then
      exit 0
    fi
    EMPTY=""
    for KEY in IBL_DM.FLOWISE_JWT_AUTH_TOKEN_SECRET IBL_DM.FLOWISE_JWT_REFRESH_TOKEN_SECRET \
               IBL_DM.FLOWISE_USER_PASSWORD IBL_DM.FLOWISE_DB_PASSWORD; do
      VALUE=$(ibl config get "$KEY") || exit 1
      [ -n "$VALUE" ] || EMPTY="$EMPTY $KEY"
    done
    if [ -n "$EMPTY" ]; then
      ibl secrets rotate $EMPTY -y >/dev/null || exit 1
      echo "FLOWISE_SECRETS_FILLED"
    fi
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: flowise_secrets
  changed_when: "'FLOWISE_SECRETS_FILLED' in flowise_secrets.stdout"
