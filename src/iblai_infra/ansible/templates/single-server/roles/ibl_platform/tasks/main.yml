---
- name: Ensure /ibl/ is owned by the SSH user
  file:
    path: "{{ ibl_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true

- name: Restore postgres data directory ownership
  file:
    path: "{{ ibl_root }}/app/ibl-dm/ibl-dm-pro/data/postgres"
    state: directory
    owner: "999"
    group: "999"
    recurse: true
  when: is_resetup | default(false) | bool
  ignore_errors: true

- name: Restart postgres after ownership fix
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose restart dm-data
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  when: is_resetup | default(false) | bool
  ignore_errors: true

- name: Wait for postgres to be ready after restart
  become: false
  shell: |
    docker exec ibl_dm_db bash -c 'pg_isready -U "$POSTGRES_USER"'
  args:
    executable: /bin/bash
  register: pg_ready_resetup
  until: pg_ready_resetup.rc == 0
  retries: 30
  delay: 2
  when: is_resetup | default(false) | bool

- name: Capture current MySQL root password before rotation
  become: false
  shell: docker exec ibl_prod_mysql printenv MYSQL_ROOT_PASSWORD
  args:
    executable: /bin/bash
  register: mysql_old_root_pass
  when: is_resetup | default(false) | bool
  ignore_errors: true

- name: Rotate secrets and auth credentials
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets rotate --all-generated -y
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: is_resetup | default(false) | bool

- name: Sync postgres password after secret rotation
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    NEW_PASS=$(ibl config get IBL_DM.DB_PASSWORD) || exit 1
    if [ -n "$NEW_PASS" ]; then
      docker exec ibl_dm_db bash -c "psql -U \$POSTGRES_USER -d \$POSTGRES_DB -c \"ALTER USER \$POSTGRES_USER WITH PASSWORD '$NEW_PASS';\""
    fi
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: is_resetup | default(false) | bool

- name: Sync MySQL passwords after secret rotation
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    OLD_ROOT_PASS="{{ mysql_old_root_pass.stdout | default('') | trim }}"
    NEW_ROOT_PASS=$(ibl config get IBL_EDX.MYSQL_ROOT_PASSWORD) || exit 1
    NEW_OPENEDX_PASS=$(ibl config get IBL_EDX.OPENEDX_MYSQL_PASSWORD) || exit 1
    if [ -n "$OLD_ROOT_PASS" ] && [ -n "$NEW_ROOT_PASS" ]; then
      docker exec ibl_prod_mysql mysql -u root -p"$OLD_ROOT_PASS" -e "ALTER USER 'root'@'%' IDENTIFIED BY '$NEW_ROOT_PASS'; ALTER USER 'root'@'localhost' IDENTIFIED BY '$NEW_ROOT_PASS'; FLUSH PRIVILEGES;" 2>/dev/null
      docker exec ibl_prod_mysql mysql -u root -p"$NEW_ROOT_PASS" -e "ALTER USER 'openedx'@'%' IDENTIFIED BY '$NEW_OPENEDX_PASS'; FLUSH PRIVILEGES;" 2>/dev/null
    fi
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: is_resetup | default(false) | bool
  ignore_errors: true

# ---------------------------------------------------------------------------
# Fernet key guard
#
# Newer iblai-cli-ops (5.x+) ships an import-time check in
# ibl-edx-sso-backend-app/constants.py (AUTHZ-VULN-06 / issue #1321) that
# rejects a missing or known-bad placeholder IBL_FERNET_KEY. On a fresh
# provision the bootstrap user_data writes a placeholder, so LMS/CMS
# crash-loop with `ImproperlyConfigured` until the key is rotated.
#
# The same guard already lives in ibl_service_update; this block is the
# fresh-provision twin. Only rotates when the key is missing/empty or one
# of the known-bad placeholders — never on a real, unique key.
# ---------------------------------------------------------------------------

# An unset secret resolves to its enforced "" default (rc 0) - that is
# the "needs rotation" signal below. A nonzero rc can only mean the key
# is unregistered (registry drift) or the CLI broke, so fail loudly
# instead of defaulting: `|| exit 1` also stops the not-found notice
# (printed to stdout) from being mistaken for a real key.
- name: Read current IBL_FERNET_KEY
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    FERNET_KEY=$(ibl config get IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_FERNET_KEY) || exit 1
    echo "$FERNET_KEY"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: current_fernet_key
  changed_when: false
  no_log: true

- name: Set fernet rotation flag
  set_fact:
    fernet_needs_rotation: >-
      {{
        (current_fernet_key.stdout | default('') | trim) in
        ['', 'BAD_FERNET_KEY', '1vCbtt_ffQ2BWc5-msIEeSBXTYNYDErBcSwPqoSjKuI=']
      }}

# No backups-dir precondition needed: `ibl secrets rotate` mkdirs its
# backup dir itself and no-ops the backup when secrets.yml doesn't exist.
- name: Rotate placeholder IBL_FERNET_KEY
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets rotate IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_FERNET_KEY -y
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: fernet_needs_rotation | bool
  register: fernet_rotation
  changed_when: fernet_rotation.rc == 0

- name: Show fernet rotation outcome
  debug:
    msg: >-
      {{
        'IBL_FERNET_KEY was placeholder/empty - rotated to a fresh key.'
        if fernet_needs_rotation
        else 'IBL_FERNET_KEY already set to a non-placeholder value - skipped rotation.'
      }}

# Batched config write (multi-pair `ibl config set` is all-or-nothing).
# Under 5.x every `--set` implicitly re-rendered; renders are explicit
# now, so the render below must come before anything that reads rendered
# output (the proxy launch).
#
# ALL scalar config lands here, before `ibl secrets generate`: secret
# generation is gated on config state (required_for/required_if in the
# upstream registry — e.g. Langfuse/Flowise secrets generate only when
# ENABLE_IBL_AI(_PLUS) is on, meilisearch keys only on VERSION=sumac).
# Setting a gate-affecting key after generate would leave its secrets
# ungenerated and the final render would block on them.
- name: Configure platform (domain, edX, API gateway, AI, RBAC)
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config set \
      BASE_DOMAIN='{{ base_domain }}' \
      IBL_EDX.VERSION='{{ edx_version }}' \
      'IBL_REVERSE_PROXY.ENABLE_UNIFIED_API_GATEWAY=true' \
      'IBL_EDX.IBL_EDX_MAGIC_LINK_LOGIN.ENABLE_JWT_AUTH=True' \
      'IBL_EDX.IBL_EDX_CORS_HEADER.CORS_ORIGIN_ALLOW_ALL=true' \
      'IBL_DM.ENABLE_IBL_AI={{ enable_ai }}' \
      'IBL_DM.ENABLE_IBL_AI_PLUS={{ enable_ai }}' \
      'IBL_DM.ALLOW_TENANTS_TO_USE_MAIN_LLM_CREDENTIALS=true' \
      'IBL_DM.ENABLE_RBAC=true' \
      'IBL_DM.ENABLE_RBAC_SEEDING=true' \
      'IBL_DM.ENABLE_RBAC_GROUP_MANAGEMENT=true' \
      'IBL_DM.ENABLE_TIMESCALEDB=true' \
      'IBL_DM.ENABLE_TIME_SPENT_UPDATE_API=true' \
      'IBL_DM.ENABLE_CREDITS=true' \
      'IBL_DM.ENABLE_NOTIFICATION_CELERY_QUEUES=true' \
      'IBL_REVERSE_PROXY.IBL_GLOBAL_PROXY.ENABLE_200_RESPONSE=true'
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# The preset runs the DM's AI call service, which needs the LiveKit key and
# secret of a separate call server (IBL_DM.LIVEKIT_API_KEY/SECRET, no
# generator). With AI on and none connected, every render fails on them, so
# the service stays off until one is; a root that has the key keeps it.
- name: Turn off AI calls when no call server is connected
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    LIVEKIT_KEY=$(ibl config get IBL_DM.LIVEKIT_API_KEY) || exit 1
    AI_CALL=$(ibl config get IBL_DM.RUN_AI_CALL) || exit 1
    if [ -z "$LIVEKIT_KEY" ] && [ "$AI_CALL" = "True" ]; then
      ibl services disable IBL_DM.RUN_AI_CALL || exit 1
      echo "AI_CALL_DISABLED"
    fi
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: ai_call_gate
  changed_when: "'AI_CALL_DISABLED' in ai_call_gate.stdout"

# The platform reads the AWS keys from secrets.yml (S3 storage, SCORM
# uploads and backups default to them); `aws configure` alone never
# reaches the rendered services.
- name: Store the platform AWS keys
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets set \
      --from-env AWS_ACCESS_KEY_ID=PLATFORM_AWS_ACCESS_KEY_ID \
      --from-env AWS_SECRET_ACCESS_KEY=PLATFORM_AWS_SECRET_ACCESS_KEY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
    PLATFORM_AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    PLATFORM_AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
  when:
    - aws_access_key_id | default('') | length > 0
    - aws_secret_access_key | default('') | length > 0
  no_log: true

# Only when both buckets are given: nothing here ever turns S3 storage off,
# so a resetup (which doesn't ask for buckets) keeps what setup configured.
- name: Store DM media and static files in S3
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config set \
      'ENABLE_S3_BUCKET_STORAGE=true' \
      'AWS_STORAGE_BUCKET_NAME={{ s3_static_bucket }}' \
      'AWS_S3_MEDIA_BUCKET_NAME={{ s3_media_bucket }}' \
      'AWS_S3_REGION_NAME={{ s3_region | default(aws_default_region, true) }}' \
      'AWS_S3_MEDIA_REGION_NAME={{ s3_region | default(aws_default_region, true) }}'
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when:
    - s3_static_bucket | default('') | length > 0
    - s3_media_bucket | default('') | length > 0

# Fills every missing generator-backed secret whose gate is active under
# the config above (fresh setup); a no-op on resetup for already-present
# values, but still fills secrets newly gated on (e.g. AI just enabled).
- name: Generate secrets
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets generate
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Fill the Flowise secrets
  ansible.builtin.import_tasks: flowise_secrets.yml

- name: Render platform config (pre-proxy)
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Make proxy upstreams resolvable
  ansible.builtin.import_tasks: proxy_hosts.yml

- name: Launch global reverse proxy
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl global-proxy launch-without-security
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Ensure ibl_local_default docker network exists
  become: false
  command: docker network create ibl_local_default
  register: net_create
  failed_when: net_create.rc != 0 and 'already exists' not in (net_create.stderr | default(''))
  changed_when: net_create.rc == 0

# (ENVIRONMENT_CONFIG is gone under 6.x — removed from the registry;
# service topology lives in services.yml via the init preset. The other
# scalar sets that used to live here moved into the pre-generate batch
# above, since secret gates depend on them.)

# IBL_EDX.IBL_EDX_SSO_BACKEND_APP needs:
#   - ENABLE_CORS_ORIGIN_WHITELIST: true
#   - IBL_CSRF_EXEMPT_URLS: [/courses, /event, /api/mfe_context]
# The list append is read-modify-write: `ibl config get --json` for the
# current value (preserve operator-added URLs), merge + dedupe in python,
# write back as a JSON list — 6.x `ibl config set` takes JSON for
# list-typed keys. Single config file now; the old staging-vs-runtime
# dual write is gone.
- name: Configure SSO backend app - CORS whitelist + CSRF-exempt URLs
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    MERGED=$(ibl config get IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_CSRF_EXEMPT_URLS --json | python3 -c "
    import json, sys
    target = ['/courses', '/event', '/api/mfe_context']
    try:
        data = json.load(sys.stdin)
        existing = data.get('value') if data.get('found') else []
    except Exception:
        existing = []
    if not isinstance(existing, list):
        existing = []
    print(json.dumps(list(dict.fromkeys(existing + target))))
    ")
    ibl config set \
      'IBL_EDX.IBL_EDX_SSO_BACKEND_APP.ENABLE_CORS_ORIGIN_WHITELIST=true' \
      "IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_CSRF_EXEMPT_URLS=$MERGED"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# Same read-modify-write as the CSRF list above. Idempotent: the merge
# only appends when missing. (The old PyYAML file surgery is gone, and
# with it the runtime-copy drift risk.)
- name: Ensure ibl-edx-uwsgi plugin is enabled
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    MERGED=$(ibl config get IBL_EDX.PLUGINS --json | python3 -c "
    import json, sys
    try:
        data = json.load(sys.stdin)
        plugins = data.get('value') if data.get('found') else []
    except Exception:
        plugins = []
    if isinstance(plugins, str):
        plugins = [p.strip() for p in plugins.split(',') if p.strip()]
    if not isinstance(plugins, list):
        plugins = []
    if 'ibl-edx-uwsgi' not in plugins:
        plugins.append('ibl-edx-uwsgi')
    print(json.dumps(plugins))
    ")
    ibl config set "IBL_EDX.PLUGINS=$MERGED"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# (Langfuse NEXTAUTH_SECRET/SALT are generator-backed under 6.x — filled
# by `ibl secrets generate` above; a config-set of a secret key would now
# hard-fail, so the old shell-generation block is gone.)

# Second explicit render: the list merges above (CSRF-exempt URLs,
# plugins) land in rendered output here.
- name: Render platform config (post-config)
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Login to ECR
  become: false
  shell: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 765174860755.dkr.ecr.us-east-1.amazonaws.com
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_default_region }}"
