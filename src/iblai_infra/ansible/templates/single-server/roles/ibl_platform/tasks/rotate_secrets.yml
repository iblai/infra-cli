---
# Every generated secret except the keys that encrypt data already stored:
# rotating those without re-encrypting leaves the DM's encrypted fields,
# Langfuse's stored secrets, the SSO backend's data and existing backups
# unreadable.
- name: Rotate secrets and auth credentials
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    python3 - <<'PY'
    import os
    import subprocess
    import sys
    from pathlib import Path

    from iblai_config.bootstrap import get_registry
    from iblai_config.commands import secrets as secrets_cmds

    KEEP = {
        "IBL_DM.FIELD_ENCRYPTION_KEY",
        "IBL_DM.LANGFUSE_ENCRYPTION_KEY",
        "IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_FERNET_KEY",
        "IBL_BACKUPS.ENCRYPTION.CRYPT_PASSWORD",
    }
    # The same set as a full rotation of generated secrets; nothing is written here.
    generated = secrets_cmds.rotate_all(Path(os.environ["IBL_ROOT"]), get_registry())
    keys = sorted(set(generated) - KEEP)
    if keys:
        sys.exit(subprocess.run(["ibl", "secrets", "rotate", *keys, "-y"]).returncode)
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
