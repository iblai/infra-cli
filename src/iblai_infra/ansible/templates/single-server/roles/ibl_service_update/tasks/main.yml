---
# ---------------------------------------------------------------------------
# Pre-flight: fix ownership + ECR login
# ---------------------------------------------------------------------------

- name: Restore postgres data directory ownership
  file:
    path: "{{ ibl_root }}/app/ibl-dm/ibl-dm-pro/data/postgres"
    state: directory
    owner: "999"
    group: "999"
    recurse: true
  ignore_errors: true

- name: Login to ECR
  become: false
  shell: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 765174860755.dkr.ecr.us-east-1.amazonaws.com
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"

# ---------------------------------------------------------------------------
# Fernet key guard
#
# Newer `iblai-edx-pro` images include the AUTHZ-VULN-06 / issue #1321 check
# in `ibl-edx-sso-backend-app/constants.py` that rejects a known-bad placeholder
# fernet key at import time. If an AMI was baked with the placeholder value,
# LMS/CMS will crash-loop with `ImproperlyConfigured` the moment the newer
# image is pulled by `ibl edx start -d`. Rotate the key in-place before that.
#
# We only rotate when the key is missing, empty, or one of the known-bad
# placeholders — never when a real, unique key is already present (that would
# invalidate encrypted data in the DB).
# ---------------------------------------------------------------------------

# An unset secret resolves to its enforced "" default (rc 0) - that is
# the "needs rotation" signal below. A nonzero rc can only mean the key
# is unregistered (registry drift) or the CLI broke, so fail loudly
# instead of defaulting: `|| exit 1` also stops the not-found notice
# (printed to stdout) from being mistaken for a real key.
- name: Read current IBL_FERNET_KEY
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    FERNET_KEY=$(ibl config get IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_FERNET_KEY) || exit 1
    echo "$FERNET_KEY"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: current_fernet_key
  changed_when: false
  no_log: true

- name: Set fernet rotation flag
  set_fact:
    fernet_needs_rotation: >-
      {{
        (current_fernet_key.stdout | default('') | trim) in
        ['', 'BAD_FERNET_KEY', '1vCbtt_ffQ2BWc5-msIEeSBXTYNYDErBcSwPqoSjKuI=']
      }}

# No backups-dir precondition needed: `ibl secrets rotate` mkdirs its
# backup dir itself and no-ops the backup when secrets.yml doesn't exist.

- name: Rotate placeholder IBL_FERNET_KEY
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl secrets rotate IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_FERNET_KEY -y
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: fernet_needs_rotation | bool
  register: fernet_rotation
  changed_when: fernet_rotation.rc == 0

- name: Show fernet rotation outcome
  debug:
    msg: >-
      {{
        'IBL_FERNET_KEY was placeholder/empty — rotated to a fresh key.'
        if fernet_needs_rotation
        else 'IBL_FERNET_KEY already set to a non-placeholder value — skipped rotation.'
      }}

# IBL_EDX.IBL_EDX_SSO_BACKEND_APP needs CORS whitelist + CSRF-exempt URLs
# alongside IBL_FERNET_KEY. The list append is read-modify-write:
# `ibl config get --json` for the current value (preserve operator-added
# URLs), merge + dedupe in python, write back as a JSON list. Single
# config file now; the old staging-vs-runtime dual write is gone.
- name: Configure SSO backend app - CORS whitelist + CSRF-exempt URLs
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    MERGED=$(ibl config get IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_CSRF_EXEMPT_URLS --json | python3 -c "
    import json, sys
    target = ['/courses', '/event', '/api/mfe_context']
    try:
        data = json.load(sys.stdin)
        existing = data.get('value') if data.get('found') else []
    except Exception:
        existing = []
    if not isinstance(existing, list):
        existing = []
    print(json.dumps(list(dict.fromkeys(existing + target))))
    ")
    ibl config set \
      'IBL_EDX.IBL_EDX_SSO_BACKEND_APP.ENABLE_CORS_ORIGIN_WHITELIST=true' \
      "IBL_EDX.IBL_EDX_SSO_BACKEND_APP.IBL_CSRF_EXEMPT_URLS=$MERGED"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# ---------------------------------------------------------------------------
# Render (regenerate all compose files with latest prod-images)
#
# Runs AFTER fernet guard + SSO backend config so the rendered settings
# pick up everything. The 5.x `ibl tutor config save` step is folded into
# `ibl render`.
# ---------------------------------------------------------------------------

- name: Render platform config
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

# service-update is pointed at a host, not a project, so the domain comes
# from the server's own config.
- name: Read the server's base domain
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config get BASE_DOMAIN
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: server_base_domain
  changed_when: false

# ---------------------------------------------------------------------------
# edX: ensure running + health check
# ---------------------------------------------------------------------------

- name: Ensure edX services are running
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl edx start -d
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 600

- name: Wait for LMS to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:8600/heartbeat 2>/dev/null | grep -qE '^(200|301|302|404)$'
  args:
    executable: /bin/bash
  register: lms_health
  until: lms_health.rc == 0
  retries: 40
  delay: 15

# ---------------------------------------------------------------------------
# DM: ensure running + wait for collectstatic + health check
# ---------------------------------------------------------------------------

- name: Run DM migrations before recreating containers
  # Critical ordering note:
  #
  # A newer `iblai-prod-images` tag may ship Django migrations that add
  # columns the new code queries during `python manage.py wait_for_db`
  # (loaded signal handlers on notification_consumer models, etc.).
  #
  # If `ibl dm update` recreates the long-running web container before
  # the schema has those columns, the new code crashes on import inside
  # `wait_for_db`, entrypoint never reaches gunicorn, port 8400 never
  # binds, and `Wait for DM web to be ready` times out after 15 min with
  # no useful signal.
  #
  # Run migrations in a one-shot container FIRST — it uses the
  # already-regenerated compose file (new image tag) to spin up a
  # throwaway instance, applies all pending migrations against the
  # existing postgres (ibl_dm_db), then exits. Schema is now ready for
  # the new code. `--entrypoint ""` bypasses the
  # wait_for_db → collectstatic → initiate_notifications → gunicorn
  # chain that would otherwise crash.
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && \
      docker compose run --rm --entrypoint "" -T web ./manage.py migrate --noinput
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  # 60 min. Older AMIs with many pending migrations against a new
  # `iblai-prod-images` tag have been observed to exceed 30 min — most of
  # the time is spent pulling the new DM image on the one-shot container.
  async: 3600
  poll: 30

- name: Fill the Flowise secrets
  ansible.builtin.import_role:
    name: ibl_platform
    tasks_from: flowise_secrets

- name: Update DM via `ibl dm update`
  # `ibl dm update` is the canonical update path — it pulls new images and
  # recreates containers to align compose state with the freshly-installed
  # iblai-prod-images package. We explicitly want this here (not plain
  # `docker compose up -d`) so that image tag bumps from a new
  # prod-images-tag actually get applied on the server in one deterministic
  # step — instead of relying on `docker compose up -d` to diff compose
  # files and partially recreate containers.
  #
  # Async + long poll because DM cold-start runs `collectstatic` +
  # `initiate_notifications` before gunicorn binds (10-15 min worst case).
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl dm update 2>&1
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  async: 3600
  poll: 30

- name: Wait for DM web to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:8400/ 2>/dev/null | grep -qE '^(200|301|302|404)$'
  args:
    executable: /bin/bash
  register: dm_health
  until: dm_health.rc == 0
  retries: 60
  delay: 15

- name: Run DM migrations
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-dm/ibl-dm-pro/ && docker compose exec -T web ./manage.py migrate --noinput
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  timeout: 600

# ---------------------------------------------------------------------------
# SPAs: force restart (containers may have exited from AMI shutdown)
# ---------------------------------------------------------------------------

- name: Discover enabled SPAs
  ansible.builtin.import_role:
    name: ibl_spa
    tasks_from: discover

- name: Restart enabled SPAs
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-spa/{{ item.name }}/ && docker compose down 2>/dev/null; docker compose up -d
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  loop: "{{ enabled_spas }}"

# 30 x 15s per SPA: a recreated SPA container runs `pnpm install` before
# Next.js starts (see ibl_spa). All were restarted above, so the waits overlap.
- name: Wait for enabled SPAs to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:{{ item.port }}/ 2>/dev/null | grep -qE '^(200|301|302)$'
  args:
    executable: /bin/bash
  register: spa_health
  until: spa_health.rc == 0
  retries: 30
  delay: 15
  loop: "{{ enabled_spas }}"

# ---------------------------------------------------------------------------
# Integrations (OAuth/OIDC — prevents 409 auth errors)
# ---------------------------------------------------------------------------

- name: Run OAuth and OIDC integrations
  ansible.builtin.import_role:
    name: integrations
    tasks_from: clients

- name: Run DM auth setup
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl dm auth-setup
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 600

- name: Sync edX with DM
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl edx sync-with-manager --users
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  timeout: 600
  ignore_errors: true

# Enforce spa-sso client_type=public + authorization_grant_type=authorization-code
# + redirect_uris on existing servers. Older provisioning runs created spa-sso
# as `confidential` + `password` with redirect_uris=https://web.<domain>, which
# doesn't match the Auth SPA's actual browser-driven authorization-code flow
# back into auth.<domain>/login/complete. Idempotent — only writes when a
# field is wrong, so re-running service-update is a no-op once corrected.
- name: Enforce spa-sso client_type=public + authorization_grant_type=authorization-code + redirect_uris
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c "
    from oauth2_provider.models import Application
    REDIRECT_URIS = ' '.join([
        'https://auth.{{ server_base_domain.stdout | trim }}/login/complete',
        'https://auth.ibl.ai/login/complete',
        'https://auth.{{ server_base_domain.stdout | trim }}/login/mobile/complete',
        'https://auth.ibl.ai/login/mobile/complete',
    ])
    try:
        app = Application.objects.get(name='spa-sso')
    except Application.DoesNotExist:
        print('SPA_SSO_RESULT:MISSING')
    else:
        changed = []
        if app.client_type != 'public':
            app.client_type = 'public'; changed.append('client_type=public')
        if app.authorization_grant_type != 'authorization-code':
            app.authorization_grant_type = 'authorization-code'; changed.append('grant=authorization-code')
        existing_uris = set((app.redirect_uris or '').split())
        expected_uris = set(REDIRECT_URIS.split())
        if existing_uris != expected_uris:
            app.redirect_uris = REDIRECT_URIS; changed.append('redirect_uris')
        if changed:
            app.save()
            print('SPA_SSO_RESULT:UPDATED ' + ','.join(changed))
        else:
            print('SPA_SSO_RESULT:ALREADY_CORRECT')
    "
  args:
    executable: /bin/bash
  register: spa_sso_enforce
  changed_when: "'UPDATED' in (spa_sso_enforce.stdout | default(''))"
  ignore_errors: true

- name: Sync SPA SSO credentials from LMS to Auth SPA config
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"

    # Read the SSO client id from the LMS database (source of truth).
    # Only the id: IBL_SPA.EDX_SSO_CLIENT_SECRET was dropped from the 6.x
    # registry (nothing renders it - spa-sso is a public authorization-code
    # client, enforced by the task above, and public clients have no
    # usable secret), so it is neither read nor written here.
    # Use grep with a unique marker to avoid Django startup noise.
    SSO_CLIENT_ID=$(docker exec ibl_prod_lms ./manage.py lms shell -c "
    from oauth2_provider.models import Application
    try:
        app = Application.objects.get(name='spa-sso')
        print('SSO_RESULT:' + app.client_id)
    except Application.DoesNotExist:
        print('SSO_RESULT:MISSING')
    " 2>/dev/null | grep '^SSO_RESULT:' | sed 's/^SSO_RESULT://')

    if [ -z "$SSO_CLIENT_ID" ] || [ "$SSO_CLIENT_ID" = "MISSING" ]; then
      echo "No spa-sso app in LMS, skipping"
    else
      echo "SSO client_id: ${SSO_CLIENT_ID:0:15}..."

      # Write back to config so Auth SPA env.js picks it up
      ibl config set "IBL_SPA.EDX_SSO_CLIENT_ID=$SSO_CLIENT_ID" || exit 1

      # Also read ibl_web client ID
      IBL_WEB_ID=$(docker exec ibl_prod_lms ./manage.py lms shell -c "
      from oauth2_provider.models import Application
      try:
          app = Application.objects.get(name='ibl_web')
          print('WEB_RESULT:' + app.client_id)
      except Application.DoesNotExist:
          print('WEB_RESULT:')
      " 2>/dev/null | grep '^WEB_RESULT:' | sed 's/^WEB_RESULT://')

      if [ -n "$IBL_WEB_ID" ]; then
        ibl config set "IBL_SPA.AUTH.IBL_OAUTH2_CLIENT_ID=$IBL_WEB_ID" || exit 1
        echo "ibl_web client_id: ${IBL_WEB_ID:0:15}..."
      fi

      # Re-render with the SSO client ids and restart the Auth SPA
      ibl render || exit 1
      cd {{ ibl_root }}/app/ibl-spa/auth/ && docker compose down 2>/dev/null; docker compose up -d
      echo "Auth SPA restarted with synced SSO credentials"
    fi
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  ignore_errors: true

# ---------------------------------------------------------------------------
# Playwright test users (opt-in: `--test-users`). They get a fixed, known
# password, which does not belong on a client's LMS.
# ---------------------------------------------------------------------------

- name: Ensure all browser test users exist in LMS
  become: false
  shell: |
    PASSWORD="ibledu_2024"
    FAILED=0
    for EMAIL in iblaiuserchromenew@ibleducation.com iblaiuserfirefoxnew@ibleducation.com iblaiusersafarinew@ibleducation.com iblaiuseredgenew@ibleducation.com; do
      USERNAME=$(echo "$EMAIL" | cut -d@ -f1)
      MARKER=$(docker exec ibl_prod_lms ./manage.py lms shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); u, c = User.objects.update_or_create(username='$USERNAME', defaults={'email': '$EMAIL', 'is_active': True}); u.set_password('$PASSWORD'); u.save(); print('USER_OK=CREATED' if c else 'USER_OK=UPDATED')" 2>/dev/null | grep '^USER_OK=' | tail -1)
      if [ -n "$MARKER" ]; then
        echo "$MARKER - $EMAIL"
      else
        echo "FAILED - $EMAIL"
        docker exec ibl_prod_lms ./manage.py lms shell -c "from django.contrib.auth import get_user_model; print('MODEL=' + str(get_user_model().objects.filter(email='$EMAIL').count()))" 2>/dev/null | grep '^MODEL=' || true
        FAILED=$((FAILED + 1))
      fi
    done
    if [ $FAILED -gt 0 ]; then
      echo "WARNING - $FAILED users failed"
    fi
    echo "Test user provisioning complete"
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  ignore_errors: true
  when: create_test_users | default(false) | bool

# ---------------------------------------------------------------------------
# Nginx + proxy reload
# ---------------------------------------------------------------------------

- name: Make proxy upstreams resolvable
  ansible.builtin.import_role:
    name: ibl_platform
    tasks_from: proxy_hosts

- name: Reload proxy and restart nginx
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl global-proxy reload 2>/dev/null || true
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Restart nginx
  shell: systemctl restart nginx

# ---------------------------------------------------------------------------
# Smoke test: verify SSO login + DM API + Mentor chat before handing off
# ---------------------------------------------------------------------------

# The 6.x rendered ibl-dm-pro tree no longer contains a config.yml
# (compose + env templates only) - read the resolved value from the
# config system instead of grepping rendered output.
- name: "Smoke test - get base domain from config"
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config get BASE_DOMAIN
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: base_domain_result

- name: "Smoke test - set domain fact"
  set_fact:
    smoke_base_domain: "{{ base_domain_result.stdout | trim }}"

# spa-sso is configured as client_type=public + authorization-code grant,
# so the password grant is not allowed against /oauth2/access_token/. We verify
# test users via Django's authenticate() instead — that's what the smoke test
# actually cares about ("do the test users exist with the right password set"),
# without depending on a grant type the production app no longer accepts.
- name: "Smoke test - verify Django credentials for browser test users"
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c "
    from django.contrib.auth import authenticate
    users = [
        'iblaiuserchromenew',
        'iblaiuserfirefoxnew',
        'iblaiusersafarinew',
        'iblaiuseredgenew',
    ]
    failed = 0
    print('=== Browser Test User Auth Smoke Test ===')
    for username in users:
        u = authenticate(username=username, password='ibledu_2024')
        if u is not None and u.is_active:
            print('PASS - ' + username)
        else:
            print('FAIL - ' + username)
            failed += 1
    if failed:
        print('SMOKE_LOGIN - ' + str(failed) + '/' + str(len(users)) + ' users FAILED')
        raise SystemExit(1)
    print('SMOKE_LOGIN - All ' + str(len(users)) + ' users authenticated successfully')
    "
  args:
    executable: /bin/bash
  register: smoke_login
  when: create_test_users | default(false) | bool

- name: "Smoke test - fail if test user auth broken"
  ansible.builtin.fail:
    msg: "Test user authentication failed. Fix test users before running Playwright tests. Output: {{ smoke_login.stdout_lines | default([]) | select('match', '^FAIL') | list | join(', ') }}"
  when:
    - create_test_users | default(false) | bool
    - smoke_login.rc != 0

- name: "Smoke test - verify DM API responds"
  become: false
  shell: |
    echo "=== DM API Smoke Test ==="
    HTTP=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:8400/ 2>/dev/null)
    if echo "$HTTP" | grep -qE '^(200|301|302|404)$'; then
      echo "PASS - DM API responded (HTTP $HTTP)"
    else
      echo "FAIL - DM not reachable (HTTP $HTTP)"
      exit 1
    fi
  args:
    executable: /bin/bash
  register: smoke_dm
  ignore_errors: true

- name: "Smoke test - verify SPAs and the Mentor API"
  become: false
  shell: |
    echo "=== SPA + Mentor Smoke Test ==="
    for PORT in {{ enabled_spas | map(attribute='port') | join(' ') }}; do
      HTTP=$(curl -sk -o /dev/null -w '%{http_code}' "http://localhost:$PORT/" 2>/dev/null)
      echo "SPA on :$PORT HTTP - $HTTP"
      if ! echo "$HTTP" | grep -qE '^(200|301|302)$'; then
        echo "FAIL - SPA on :$PORT not responding (HTTP $HTTP)"
        exit 1
      fi
    done
    CHAT_HTTP=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:8400/api/ibl/manage/v1/mentor/ 2>/dev/null)
    echo "DM Mentor API HTTP - $CHAT_HTTP"
    if echo "$CHAT_HTTP" | grep -qE '^(200|301|302|401|403|404)$'; then
      echo "PASS - Mentor API reachable (HTTP $CHAT_HTTP)"
    else
      echo "FAIL - Mentor API unreachable (HTTP $CHAT_HTTP)"
      exit 1
    fi
  args:
    executable: /bin/bash
  register: smoke_mentor
  ignore_errors: true

- name: "Smoke test - results summary"
  ansible.builtin.debug:
    msg: |
      === SMOKE TEST RESULTS ===
      Test users:  {{ ('PASS' if (smoke_login.rc | default(1)) == 0 else 'FAIL') if (create_test_users | default(false) | bool) else 'SKIPPED' }}
      DM API:      {{ 'PASS' if (smoke_dm.rc | default(1)) == 0 else 'FAIL' }}
      SPAs:        {{ 'PASS' if (smoke_mentor.rc | default(1)) == 0 else 'FAIL' }}
      {{ 'All smoke tests passed.' if (((smoke_login.rc | default(1)) == 0 or not (create_test_users | default(false) | bool)) and (smoke_dm.rc | default(1)) == 0 and (smoke_mentor.rc | default(1)) == 0) else 'WARNING - Some smoke tests failed. Check logs above.' }}
