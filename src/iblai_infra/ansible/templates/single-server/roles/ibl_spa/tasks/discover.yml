---
# The service toggles are the single source of truth for which SPAs
# run — the init preset decides, the roles follow. `ibl services
# list --json` (enabled-only by default) enumerates them, so an SPA
# added upstream deploys without a change here.
#
# The role still leans on the upstream naming convention — toggle
# IBL_SPA.RUN_<NAME>_SPA ↔ port key IBL_SPA.<NAME>.PORT ↔ rendered dir
# app/ibl-spa/<name lowercase>/. The port lookup is validated here
# because its natural failure mode is a slow, confusing one (a 7.5-min
# health-check timeout against an empty port); the dir needs no check —
# the launch task's `cd` fails immediately with the path in the error.
- name: Discover enabled SPAs
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    python3 - <<'PY'
    import json
    import re
    import subprocess
    import sys

    listing = subprocess.run(
        ['ibl', 'services', 'list', '--json', '-p', 'IBL_SPA.RUN_'],
        capture_output=True, text=True,
    )
    if listing.returncode != 0:
        sys.exit(f'ibl services list failed: {listing.stderr.strip()}')
    toggles = json.loads(listing.stdout)
    enabled = sorted(
        m.group(1)
        for key, entry in toggles.items()
        for m in [re.fullmatch(r'IBL_SPA\.RUN_([A-Z0-9_]+)_SPA', key)]
        if m and entry.get('value')
    )
    for name in enabled:
        port = subprocess.run(
            ['ibl', 'config', 'get', f'IBL_SPA.{name}.PORT'],
            capture_output=True, text=True,
        )
        if port.returncode != 0 or not port.stdout.strip():
            sys.exit(
                f'IBL_SPA.RUN_{name}_SPA is enabled but IBL_SPA.{name}.PORT '
                f'did not resolve - the toggle/port naming convention this '
                f'role relies on may have changed upstream.'
            )
        print(json.dumps({'name': name.lower(), 'port': port.stdout.strip()}))
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: spa_discovery
  changed_when: false

- name: Build enabled SPA list
  set_fact:
    enabled_spas: "{{ spa_discovery.stdout_lines | map('from_json') | list }}"

- name: Verify at least one SPA is enabled
  fail:
    msg: >-
      No IBL_SPA.RUN_*_SPA toggle is enabled - check services.yml (the
      init preset should have enabled at least AUTH/LMS/OS).
  when: enabled_spas | length == 0
