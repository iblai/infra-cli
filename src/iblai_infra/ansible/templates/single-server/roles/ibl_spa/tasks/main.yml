---
- name: Generate SPA SSO client credentials
  shell: |
    python3 -c "
    import string, random, base64
    chars = string.ascii_letters + string.digits
    cid = base64.b64encode(''.join(random.choice(chars) for _ in range(30)).encode()).decode()
    sec = base64.b64encode(''.join(random.choice(chars) for _ in range(60)).encode()).decode()
    print(cid)
    print(sec)
    "
  register: spa_credentials
  changed_when: false

- name: Set SPA credential facts
  set_fact:
    spa_sso_client_id: "{{ spa_credentials.stdout_lines[0] | trim }}"
    spa_sso_client_secret: "{{ spa_credentials.stdout_lines[1] | trim }}"

- name: Wait for LMS to be ready and stable
  become: false
  shell: |
    docker inspect --format='{{ '{{' }}.State.Running{{ '}}' }}' ibl_prod_lms 2>/dev/null | grep -q true && \
    docker inspect --format='{{ '{{' }}.State.Restarting{{ '}}' }}' ibl_prod_lms 2>/dev/null | grep -q false && \
    docker exec ibl_prod_lms echo "LMS ready"
  args:
    executable: /bin/bash
  register: lms_ready
  until: lms_ready.rc == 0
  retries: 60
  delay: 15

# spa-sso must be `client_type=public` + `authorization_grant_type=authorization-code`
# to match the Auth SPA's actual login flow (browser-driven authorization-code
# redirect against learn.<domain>/oauth2/authorize). The earlier `confidential` +
# `password` defaults predate the SPA's real auth flow and would only authenticate
# via curl-style password grants — never through the SPA itself. `get_or_create`
# defaults are NOT applied to existing rows, so we explicitly enforce the
# desired client_type / grant_type / redirect_uris on every run (idempotent).
#
# redirect_uris must include the env's own auth SPA AND auth.ibl.ai so the
# canonical production Auth SPA can also redirect back into this env. Each
# host gets both /login/complete (web) and /login/mobile/complete (mobile)
# callbacks. oauth2_provider stores this as a space-separated string.
- name: Create OAuth2 Application in edX for SPA SSO
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c "
    from oauth2_provider.models import Application
    from django.contrib.auth.models import User
    REDIRECT_URIS = ' '.join([
        'https://auth.{{ base_domain }}/login/complete',
        'https://auth.ibl.ai/login/complete',
        'https://auth.{{ base_domain }}/login/mobile/complete',
        'https://auth.ibl.ai/login/mobile/complete',
    ])
    usr = User.objects.get(username='ibl_admin')
    app, created = Application.objects.get_or_create(
        name='spa-sso',
        user=usr,
        defaults={
            'client_id': '{{ spa_sso_client_id }}',
            'client_secret': '{{ spa_sso_client_secret }}',
            'client_type': 'public',
            'authorization_grant_type': 'authorization-code',
            'redirect_uris': REDIRECT_URIS,
            'skip_authorization': True,
        },
    )
    changed = False
    if app.client_type != 'public':
        app.client_type = 'public'; changed = True
    if app.authorization_grant_type != 'authorization-code':
        app.authorization_grant_type = 'authorization-code'; changed = True
    existing_uris = set((app.redirect_uris or '').split())
    expected_uris = set(REDIRECT_URIS.split())
    if existing_uris != expected_uris:
        app.redirect_uris = REDIRECT_URIS; changed = True
    if changed:
        app.save()
    print(app.client_id)
    "
  args:
    executable: /bin/bash
  register: oauth_app_result
  until: oauth_app_result.rc == 0
  retries: 10
  delay: 30

- name: Capture actual SPA SSO client ID from edX
  set_fact:
    spa_sso_client_id: "{{ oauth_app_result.stdout_lines | last | trim }}"
  when:
    - oauth_app_result.stdout_lines is defined
    - oauth_app_result.stdout_lines | length > 0

- name: Create ibl_web OAuth2 Application for Auth SPA
  become: false
  shell: |
    docker exec ibl_prod_lms ./manage.py lms shell -c \
      'from oauth2_provider.models import Application; from django.contrib.auth.models import User; usr=User.objects.get(username="ibl_admin"); app, created = Application.objects.get_or_create(name="ibl_web", user=usr, defaults={"client_type": "public", "authorization_grant_type": "password", "redirect_uris": "", "skip_authorization": True}); print(app.client_id)'
  args:
    executable: /bin/bash
  register: ibl_web_app_result
  until: ibl_web_app_result.rc == 0
  retries: 10
  delay: 15

- name: Capture ibl_web client ID
  set_fact:
    ibl_web_client_id: "{{ ibl_web_app_result.stdout_lines | last | trim }}"
  when:
    - ibl_web_app_result.stdout_lines is defined
    - ibl_web_app_result.stdout_lines | length > 0

# One batched, all-or-nothing write. The former "quoted boolean" PyYAML
# surgery is gone: registry-typed `ibl config set` stores str-typed keys
# ('true'/'false') exactly, and coerces the two bool-typed ones
# (MENTOR.SKIP_TEST, MENTOR.ENABLE_APP_SITE_ASSOCIATION) to real bools —
# the type upstream's templates expect.
- name: Set SPA configuration
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl config set \
      'IBL_SPA.EDX_SSO_CLIENT_ID={{ spa_sso_client_id }}' \
      'IBL_SPA.AUTH.IBL_OAUTH2_CLIENT_ID={{ ibl_web_client_id }}' \
      'IBL_SPA.AUTH.DOMAIN=https://auth.{{ base_domain }}' \
      'IBL_SPA.AUTH.DEFAULT_APP_URL=os.{{ base_domain }}' \
      'IBL_SPA.ENVIRONMENT={{ base_domain }}' \
      'IBL_SPA.MENTOR.IFRAME_MENTOR_DOMAIN=https://os.{{ base_domain }}' \
      'IBL_SPA.MENTOR.DOMAIN=https://os.{{ base_domain }}' \
      'IBL_SPA.SKILLS.DOMAIN=lms.{{ base_domain }}' \
      'IBL_SPA.MENTOR.ENABLE_RBAC=true' \
      'IBL_SPA.MENTOR.STRIPE_ENABLED=false' \
      'IBL_SPA.MENTOR.ENABLE_ADVERTISING=false' \
      'IBL_SPA.MENTOR.SKIP_TEST=true' \
      'IBL_SPA.MENTOR.ENABLE_APP_SITE_ASSOCIATION=true' \
      'IBL_SPA.MENTOR.CANVAS_ADMIN_ONLY=false' \
      'IBL_SPA.MENTOR.HIDE_ANALYTICS=false' \
      'IBL_SPA.SKILLS.ENABLE_RBAC=true'
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Render templates with SPA configuration
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Login to ECR for SPA images
  become: false
  shell: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 765174860755.dkr.ecr.us-east-1.amazonaws.com
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_default_region }}"

# The service toggles are the single source of truth for which SPAs
# deploy — the init preset decides, this role follows. `ibl services
# list --json` (enabled-only by default) enumerates them, so an SPA
# added upstream deploys without a change here.
#
# The role still leans on the upstream naming convention — toggle
# IBL_SPA.RUN_<NAME>_SPA ↔ port key IBL_SPA.<NAME>.PORT ↔ rendered dir
# app/ibl-spa/<name lowercase>/. The port lookup is validated here
# because its natural failure mode is a slow, confusing one (a 7.5-min
# health-check timeout against an empty port); the dir needs no check —
# the launch task's `cd` fails immediately with the path in the error.
- name: Discover enabled SPAs
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    python3 - <<'PY'
    import json
    import re
    import subprocess
    import sys

    listing = subprocess.run(
        ['ibl', 'services', 'list', '--json', '-p', 'IBL_SPA.RUN_'],
        capture_output=True, text=True,
    )
    if listing.returncode != 0:
        sys.exit(f'ibl services list failed: {listing.stderr.strip()}')
    toggles = json.loads(listing.stdout)
    enabled = sorted(
        m.group(1)
        for key, entry in toggles.items()
        for m in [re.fullmatch(r'IBL_SPA\.RUN_([A-Z0-9_]+)_SPA', key)]
        if m and entry.get('value')
    )
    for name in enabled:
        port = subprocess.run(
            ['ibl', 'config', 'get', f'IBL_SPA.{name}.PORT'],
            capture_output=True, text=True,
        )
        if port.returncode != 0 or not port.stdout.strip():
            sys.exit(
                f'IBL_SPA.RUN_{name}_SPA is enabled but IBL_SPA.{name}.PORT '
                f'did not resolve - the toggle/port naming convention this '
                f'role relies on may have changed upstream.'
            )
        print(json.dumps({'name': name.lower(), 'port': port.stdout.strip()}))
    PY
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  register: spa_discovery
  changed_when: false

- name: Build enabled SPA list
  set_fact:
    enabled_spas: "{{ spa_discovery.stdout_lines | map('from_json') | list }}"

- name: Verify at least one SPA is enabled
  fail:
    msg: >-
      No IBL_SPA.RUN_*_SPA toggle is enabled - check services.yml (the
      init preset should have enabled at least AUTH/LMS/OS).
  when: enabled_spas | length == 0

- name: Launch enabled SPAs
  become: false
  shell: |
    cd {{ ibl_root }}/app/ibl-spa/{{ item.name }}/ && docker compose pull && docker compose down && docker compose up -d
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
  loop: "{{ enabled_spas }}"

# Budget: 30 × 15s = 450s (7.5 min) per SPA. SPA images don't ship with
# node_modules baked in — the container runs `pnpm install` on first
# boot (~80–120s observed) before Next.js can start. Combined with
# `docker compose pull` and image-extraction overhead, cold start can
# easily exceed a 150s budget on a slower instance or marginal network.
# All SPAs were started above, so their cold starts overlap and the
# waits after the first mostly return immediately.
- name: Wait for enabled SPAs to be ready
  become: false
  shell: |
    curl -s -o /dev/null -w '%{http_code}' http://localhost:{{ item.port }}/ 2>/dev/null | grep -qE '^(200|301|302)$'
  args:
    executable: /bin/bash
  register: spa_health
  until: spa_health.rc == 0
  retries: 30
  delay: 15
  loop: "{{ enabled_spas }}"

- name: Render config and reload proxy after SPA launch
  become: false
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
    pyenv activate "{{ venv_name }}"
    ibl render && ibl global-proxy reload
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"

- name: Verify SPA containers are running
  command: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}" --filter "name=spa"
  register: spa_containers
  changed_when: false

- name: Display SPA status
  debug:
    msg: "{{ spa_containers.stdout_lines }}"
