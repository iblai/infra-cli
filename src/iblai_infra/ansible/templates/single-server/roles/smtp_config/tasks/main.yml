---
# Optional SMTP configuration. Runs only when `smtp_enabled` is true (CLI
# prompt during `iblai infra setup`, or `--smtp-host` / `SMTP_HOST` for
# `iblai infra launch`).
#
# Writes the IBL_SMTP_* + IBL_SMTP_SYSTEM_* config keys (single config
# root under 6.x — the old staging/runtime dual write is gone). The
# password is a registry secret: it goes through `ibl secrets set
# --from-env` (env form keeps it out of `ps` and argv), and ONLY
# IBL_SMTP_PASSWORD — IBL_SMTP_SYSTEM_PASSWORD was removed upstream (DM
# mirrors compute from IBL_SMTP_PASSWORD; writing the removed key is a
# hard error).
#
# Runs BEFORE service-start roles in both setup and launch playbooks, so
# the rendered Compose templates pick up SMTP_HOST/USER/PASSWORD env vars
# on first boot — no service restart required.

- name: Set SMTP password secret
  become: false
  ansible.builtin.shell:
    cmd: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
      pyenv activate "{{ venv_name }}"
      ibl secrets set --from-env IBL_SMTP_PASSWORD=SMTP_PASSWORD
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
    SMTP_PASSWORD: "{{ smtp_password }}"
  when: smtp_enabled | default(false) | bool
  no_log: true  # task environment carries the SMTP password

# IBL_SMTP_SYSTEM_PORT is int-typed and TLS/SSL are bool-typed in the 6.x
# registry — `ibl config set` coerces "587"/True/False accordingly (the
# old "quoted string port" on-disk form is gone with the registry types).
- name: Set SMTP config values
  become: false
  ansible.builtin.shell:
    cmd: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
      pyenv activate "{{ venv_name }}"
      ibl config set \
        'IBL_SMTP_HOST={{ smtp_host }}' \
        'IBL_SMTP_USER={{ smtp_username }}' \
        'IBL_SMTP_SENDER_MAIL={{ smtp_sender_email }}' \
        'IBL_SMTP_SYSTEM_HOST={{ smtp_host }}' \
        'IBL_SMTP_SYSTEM_USER={{ smtp_username }}' \
        'IBL_SMTP_SYSTEM_SENDER_MAIL={{ smtp_sender_email }}' \
        'IBL_SMTP_SYSTEM_PORT={{ smtp_port }}' \
        'IBL_SMTP_SYSTEM_TLS={{ smtp_use_tls | bool }}' \
        'IBL_SMTP_SYSTEM_EMAIL_USE_SSL={{ smtp_use_ssl | bool }}'
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: smtp_enabled | default(false) | bool

- name: Render templates so SMTP_* env vars land in compose files
  become: false
  ansible.builtin.shell:
    cmd: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
      pyenv activate "{{ venv_name }}"
      ibl render
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when: smtp_enabled | default(false) | bool

# During a full setup the services start *after* this role, so they read the
# new env vars on first boot and nothing needs restarting. When SMTP is added
# to an already-running environment the containers are already up with the old
# environment, so the compose files rendered above only take effect once the
# services are recreated. `iblai infra smtp enable` sets `restart_services`
# after asking; a normal setup leaves it false and skips this entirely.
- name: Recreate DM services so they pick up the new mail settings
  become: false
  ansible.builtin.shell:
    cmd: docker compose up -d
    executable: /bin/bash
    chdir: "{{ ibl_root }}/app/ibl-dm/ibl-dm-pro"
  environment:
    HOME: "/home/{{ ansible_user }}"
  when:
    - smtp_enabled | default(false) | bool
    - restart_services | default(false) | bool

- name: Restart edX so it picks up the new mail settings
  become: false
  ansible.builtin.shell:
    cmd: |
      export PYENV_ROOT="{{ pyenv_root }}"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"; eval "$(pyenv virtualenv-init -)"
      pyenv activate "{{ venv_name }}"
      ibl edx stop
      ibl edx start -d
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    HOME: "/home/{{ ansible_user }}"
    IBL_ROOT: "{{ ibl_root }}/"
    NODE_ID: "{{ node_id }}"
  when:
    - smtp_enabled | default(false) | bool
    - restart_services | default(false) | bool

- name: Confirm SMTP configuration applied
  ansible.builtin.debug:
    msg: "SMTP configured: {{ smtp_username }}@{{ smtp_host }}:{{ smtp_port }} (tls={{ smtp_use_tls }}, ssl={{ smtp_use_ssl }})"
  when: smtp_enabled | default(false) | bool
