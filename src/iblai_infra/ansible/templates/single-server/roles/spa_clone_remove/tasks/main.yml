---
# Remove a cloned SPA: stop its containers, drop its nginx block, delete its
# directory. Used by `iblai infra spa remove`.
#
# Only ever run against a clone. The CLI refuses the stock SPA names before it
# gets here, because this would otherwise happily delete the platform's own
# mentor or auth deployment.
#
# Gated on `spa_remove_enabled` so it stays a no-op during a normal setup.

- name: Check the SPA directory exists
  become: false
  ansible.builtin.stat:
    path: "{{ ibl_root }}/app/ibl-spa/{{ spa_remove_name }}"
  register: spa_remove_dir
  when: spa_remove_enabled | default(false) | bool

- name: Fail when there is nothing to remove
  ansible.builtin.fail:
    msg: "No SPA named '{{ spa_remove_name }}' at {{ ibl_root }}/app/ibl-spa/."
  when:
    - spa_remove_enabled | default(false) | bool
    - not spa_remove_dir.stat.exists

- name: Stop and remove the containers
  become: false
  ansible.builtin.command:
    cmd: docker compose down
    chdir: "{{ ibl_root }}/app/ibl-spa/{{ spa_remove_name }}"
  changed_when: true
  # A half-created clone may have no containers; that must not block cleanup.
  failed_when: false
  when: spa_remove_enabled | default(false) | bool

- name: Remove the nginx server block
  ansible.builtin.file:
    path: "/etc/nginx/conf.d/custom_domains/{{ spa_remove_name }}.conf"
    state: absent
  when: spa_remove_enabled | default(false) | bool

- name: Validate the nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: spa_remove_enabled | default(false) | bool

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: spa_remove_enabled | default(false) | bool

- name: Remove the SPA directory
  ansible.builtin.file:
    path: "{{ ibl_root }}/app/ibl-spa/{{ spa_remove_name }}"
    state: absent
  when: spa_remove_enabled | default(false) | bool

- name: Report the removal
  ansible.builtin.debug:
    msg: "{{ spa_remove_name }} removed - containers, nginx block and directory."
  when: spa_remove_enabled | default(false) | bool
